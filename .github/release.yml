# Configures the categorized sections GitHub's auto-generated release notes
# use (via repos.generateReleaseNotes, called from .github/workflows/release.yaml).
# PRs are sorted into a section by label; label a PR "breaking-change" to have
# it called out under its own heading instead of blending into the general list.
#
# A "breaking-change"-labeled PR should also include a "## ⚠️ Breaking
# Changes" section in its description - .github/scripts/release-notes.js
# pulls that section's full content (not just the PR title) to the very top
# of the generated release notes, since a one-line title isn't enough for
# something an operator needs to actually read before upgrading.
changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking-change
    - title: "🚀 Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🔒 Security"
      labels:
        - security
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "🧹 Other Changes"
      labels:
        - "*"
