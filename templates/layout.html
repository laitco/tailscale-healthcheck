<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tailscale Healthcheck{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='app/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app/app.css') }}">
    <script nonce="{{ csp_nonce }}">
      (function () {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        document.documentElement.classList.toggle('dark', mql.matches);
      })();
    </script>
  </head>
  <body>
    {% block body %}
    <div id="root"></div>
    <script type="module" src="{{ url_for('static', filename='app/app.js') }}"></script>
    {% endblock %}
  </body>
</html>
